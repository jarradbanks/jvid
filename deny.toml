# cargo-deny: advisories and licenses. Copyleft (GPL/LGPL/AGPL) is not in
# the allow list, so any such crate in our tree fails the check (PLAN.md "Licensing").
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly; transitive ones are upstream's call.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# egui's bundled default fonts; font licences, not code copyleft.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# MPL-2.0 is file-level copyleft: fine to depend on unmodified (via dirs-sys).
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# WTFPL is permissive (no copyleft). The FFmpeg libraries these bind to are
# dynamically linked, never compiled in (PLAN.md "Licensing", docs/adr/0001).
[[licenses.exceptions]]
crate = "ffmpeg-next"
allow = ["WTFPL"]

[[licenses.exceptions]]
crate = "ffmpeg-sys-next"
allow = ["WTFPL"]

# Unlicense is a public-domain dedication (no copyleft); the whisper.cpp they compile is MIT.
[[licenses.exceptions]]
crate = "whisper-rs"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "whisper-rs-sys"
allow = ["Unlicense"]

# Mozilla's CA list as data under a permissive data licence (ureq's TLS roots, model downloads).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
