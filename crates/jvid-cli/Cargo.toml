[package]
name = "jvid-cli"
description = "Headless render for jvid projects."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "jvid"
path = "src/main.rs"

[dependencies]
jvid-app = { path = "../jvid-app" }
jvid-core.workspace = true
jvid-jobs.workspace = true
jvid-log.workspace = true

[dev-dependencies]
jvid-media = { workspace = true, features = ["test-support"] }
suite-ui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
