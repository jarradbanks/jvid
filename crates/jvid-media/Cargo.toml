[package]
name = "jvid-media"
description = "FFmpeg probe, decode and encode, thumbnails, waveforms and proxies for jvid."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
image.workspace = true
jvid-core.workspace = true
jvid-jobs.workspace = true
ffmpeg-next.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Link a GPL FFmpeg (x264/x265); the default expects LGPL. See docs/adr/0001-ffmpeg-binding.md.
gpl-ffmpeg = []
# Test media corpus helpers; dev-dependency use only.
test-support = []

[dev-dependencies]
jvid-media = { path = ".", features = ["test-support"] }
tempfile.workspace = true
