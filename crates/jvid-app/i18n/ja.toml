# jvid-app strings, Japanese. Keep keys and {placeholders} in step with en.toml.
# Terms follow docs/i18n/ja.md. Buttons and menu items are noun phrases (保存, マーカーを追加);
# messages use the polite form; Japanese text uses full-width 、。？：「」.
# Japanese has only the `other` plural form; each `.one` repeats it because the parity test wants
# every English key.

