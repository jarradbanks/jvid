# jvid-app strings, Korean. Keep keys and {placeholders} in step with en.toml.
# Terms follow docs/i18n/ko.md. Buttons and menu items are noun phrases (저장, 마커 추가);
# messages use the polite 합니다 form; a particle after a {placeholder} is written 을(를), 이(가).
# Korean has only the `other` plural form; each `.one` repeats it because the parity test wants
# every English key.

