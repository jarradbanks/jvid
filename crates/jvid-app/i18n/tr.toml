# jvid-app strings, Turkish. Keep keys and {placeholders} in step with en.toml.
# Labels, buttons and menu items capitalize each word except ve, veya, ile, için (Farklı Kaydet,
# Tümünü Seç), as Windows and macOS Turkish do; messages are sentences. Commands use the plain
# imperative (Kaydet), instructions to the user the polite one (seçin). No suffix is glued to a
# {placeholder}: vowel harmony can't follow it. Terms follow docs/i18n/tr.md.

