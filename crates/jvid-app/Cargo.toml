[package]
name = "jvid-app"
description = "The jvid desktop video editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jvid-audio.workspace = true
jvid-core.workspace = true
jvid-jobs.workspace = true
jvid-log.workspace = true
jvid-media.workspace = true
directories.workspace = true
tracing.workspace = true
jvid-render.workspace = true
suite-ui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
serde.workspace = true
toml.workspace = true

[features]
gpl-ffmpeg = ["jvid-media/gpl-ffmpeg"]

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
suite-ui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
