[package]
name = "jvid-app"
description = "The jvid desktop video editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jvid-audio.workspace = true
jvid-core.workspace = true
jvid-jobs.workspace = true
jvid-log.workspace = true
jvid-media.workspace = true
jvid-transcribe.workspace = true
jvid-paths.workspace = true
jvid-update-config.workspace = true
j-update.workspace = true
same-file.workspace = true
tracing.workspace = true
image.workspace = true
jvid-render.workspace = true
j-ui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
subsecond = { version = "0.7", optional = true }
dioxus-devtools = { version = "0.7", optional = true }
j-ui-debug = { git = "https://github.com/jarradbanks/j-ui.git", rev = "1ab837487597e6c7a43625e4a2010fe3f77354bd", optional = true }

[features]
gpl-ffmpeg = ["jvid-media/gpl-ffmpeg"]
debug-ui = ["dep:j-ui-debug"]
hot-reload = ["dep:subsecond", "dep:dioxus-devtools"]

[dev-dependencies]
tempfile.workspace = true
ureq.workspace = true
egui_kittest = { workspace = true, features = ["eframe"] }
j-ui = { workspace = true, features = ["test-support"] }
jvid-media = { workspace = true, features = ["test-support"] }
# The translation guard in tests/i18n_guard.rs parses the UI sources.
syn = { version = "2.0.119", features = ["full", "visit-mut"] }
# Names the token enums syn hands the guard (already in the build through syn).
proc-macro2 = { version = "1.0.107", default-features = false }
# Captures the preview's warnings in tests; already in the build through jvid-log.
tracing-subscriber = "0.3"

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
