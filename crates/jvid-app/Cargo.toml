[package]
name = "jvid-app"
description = "The jvid desktop video editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
jvid-audio.workspace = true
jvid-core.workspace = true
jvid-jobs.workspace = true
jvid-log.workspace = true
jvid-media.workspace = true
directories.workspace = true
tracing.workspace = true
image.workspace = true
jvid-render.workspace = true
suite-ui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
serde.workspace = true
toml.workspace = true

[features]
gpl-ffmpeg = ["jvid-media/gpl-ffmpeg"]

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
suite-ui = { workspace = true, features = ["test-support"] }
jvid-media = { workspace = true, features = ["test-support"] }
# The translation guard in tests/i18n_guard.rs parses the UI sources.
syn = { version = "2.0.119", features = ["full", "visit-mut"] }
# Names the token enums syn hands the guard (already in the build through syn).
proc-macro2 = { version = "1.0.107", default-features = false }

[lints]
workspace = true
