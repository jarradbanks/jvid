name: i18n

# Called by CI so its required check also waits for translation validation (#309).
on:
  workflow_call:

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest's Python 3.12 has tomllib.
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/i18n_check.py
