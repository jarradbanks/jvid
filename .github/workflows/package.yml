name: Package
run-name: ${{ (github.event_name == 'push' || inputs.release) && startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Package {0}', github.ref_name) }}

on:
  pull_request:
    paths:
      - '.github/workflows/package.yml'
      - 'packaging/**'
      - 'scripts/packaging/**'
      - 'scripts/release/**'
      - 'crates/jvid-paths/**'
      - 'crates/jvid-updater/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/jvid-app/src/components.rs'
      - 'crates/jvid-app/src/package_smoke.rs'
  workflow_dispatch:
    inputs:
      release:
        description: Publish this immutable version tag after protected release approval
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: 'OFF'
  GGML_METAL: 'OFF'
  # One workflow-scope trust root for every native build and the protected generator.
  JVID_UPDATE_PUBLIC_KEY: ${{ vars.JVID_UPDATE_PUBLIC_KEY }}

jobs:
  release-status:
    name: release publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.status.outputs.build }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip published releases and enforce explicit tag opt-in
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
          JVID_RELEASE_ENABLED: ${{ vars.JVID_RELEASE_ENABLED }}
        run: python scripts/release/publish.py status

  build:
    needs: release-status
    if: needs.release-status.outputs.build == 'true'
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: macos-14
            target: macos-aarch64
          - os: ubuntu-22.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/packaging -p 'test_*.py'
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/packaging')
          from build import version
          ref = os.environ['GITHUB_REF']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('JVID_UPDATE_VERSION=' + version() + '\n')
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version():
              raise SystemExit('Release tag must match workspace.package.version')
          PY
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # Capture source packages from the same authenticated Ubuntu repositories.
          # Use explicit HTTPS origins and bounded waits instead of the runner's Azure mirror.
          sudo tee /etc/apt/sources.list.d/jvid-release.sources >/dev/null <<'EOF'
          Types: deb deb-src
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: jammy jammy-updates jammy-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb deb-src
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: jammy-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/jvid-release.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends clang libclang-dev pkg-config patchelf binutils \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev \
            libasound2-dev libx11-6 libxcursor1 libxi6 libxrandr2 libxkbcommon0 libxkbcommon-x11-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libfontconfig1 libfreetype6 libdbus-1-3
          # Hosted images can retain superseded libraries whose source indexes have
          # expired. Align those exact binary packages before compiling/staging.
          # setup-python adds its own libpython search path. Inspect the system
          # runtime using the runner's system Python without that unrelated override.
          env -u LD_LIBRARY_PATH /usr/bin/python3 scripts/packaging/prepare_linux_runtime.py --output "$RUNNER_TEMP/jvid-native-upgrades.txt"
          mapfile -t upgrade_packages < "$RUNNER_TEMP/jvid-native-upgrades.txt"
          if ((${#upgrade_packages[@]})); then
            sudo apt-get "${apt_options[@]}" install -y --only-upgrade "${upgrade_packages[@]}"
          fi
          env -u LD_LIBRARY_PATH /usr/bin/python3 scripts/packaging/prepare_linux_runtime.py --check
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg@7 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
          major=$(PKG_CONFIG_PATH="$(brew --prefix ffmpeg@7)/lib/pkgconfig" pkg-config --modversion libavcodec | cut -d. -f1)
          test "$major" -ge 58 && test "$major" -le 62
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Windows build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Windows shared runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/packaging/fetch_ffmpeg.py "$env:RUNNER_TEMP/ffmpeg"
          "FFMPEG_DIR=$env:RUNNER_TEMP/ffmpeg" >> $env:GITHUB_ENV
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
          # whisper.cpp and Rust use the static MSVC CRT; UCRT is supplied by Windows.
          'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV
          'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/ffmpeg/bin" >> $env:GITHUB_PATH
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }
      - name: Build editor with required codecs
        run: cargo build --locked --release -p jvid-app --features gpl-ffmpeg
      # Global public key and JVID_UPDATE_VERSION also apply to this build.
      - name: Build updater helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p jvid-updater --bin jvid-update-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = 'target/x86_64-pc-windows-msvc/release/jvid-update-helper.exe'
          if (!(Test-Path -PathType Leaf $helper)) { throw 'Updater helper is required in Windows packages' }
          python scripts/packaging/build.py --target windows-x86_64 --binary target/x86_64-pc-windows-msvc/release/jvid-app.exe --ffmpeg-dir "$env:FFMPEG_DIR" --helper $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = (Get-ChildItem dist/*-portable.zip).FullName
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          python scripts/packaging/smoke.py $zip --evidence dist/smoke --windows-install $setup
      - name: Assemble Linux tarball
        if: runner.os == 'Linux'
        run: |
          python scripts/packaging/build.py --target linux-x86_64 --binary target/release/jvid-app
          python scripts/packaging/smoke.py dist/*-portable.tar.gz --evidence dist/smoke
      - name: Exercise Linux artifact in a fresh runtime container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/artifacts" ubuntu:22.04 bash -euxc '
            mkdir /opt/jvid
            tar -xzf /artifacts/*-portable.tar.gz -C /opt/jvid
            env -i HOME=/tmp/jvid-home PATH=/usr/bin:/bin /opt/jvid/*/AppRun --smoke-test /artifacts/clean-runtime
          '
      - name: Assemble and verify macOS app, DMG and portable ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/packaging/build.py --target macos-aarch64 --binary target/release/jvid-app
          hdiutil verify dist/*.dmg
          hdiutil attach dist/*.dmg -mountpoint "$RUNNER_TEMP/jvid-dmg" -nobrowse
          "$RUNNER_TEMP/jvid-dmg/jvid.app/Contents/MacOS/jvid-app" --smoke-test dist/smoke/dmg
          hdiutil detach "$RUNNER_TEMP/jvid-dmg"
          python scripts/packaging/smoke.py dist/*-portable.zip --evidence dist/smoke
      - name: Capture exact native corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/packaging/sources.py native --target ${{ matrix.target }} --output source-assets
      - name: Retain native source bundle
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.target }}
          path: source-assets/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Checksums
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(p for p in Path('dist').iterdir() if p.is_file())
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - name: Retain artifacts and evidence without releasing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/smoke/
            dist/clean-runtime/
          if-no-files-found: error

  sources-rust:
    needs: release-status
    if: needs.release-status.outputs.build == 'true'
    name: workspace and vendored source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: source-vendor
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Capture exact checkout and verify vendored sources offline
        run: python scripts/packaging/sources.py rust --output source-assets
      - uses: actions/upload-artifact@v4
        with:
          name: sources-rust
          path: source-assets/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  source-check:
    name: complete release source contract
    needs: [build, sources-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: sources-*
          path: sources
      - name: Bind complete sources to exact native package bytes
        run: |
          python scripts/packaging/collect.py packages release-assets
          python scripts/packaging/assert_assets.py release-assets
          python scripts/packaging/sources.py release --sources sources --native release-assets --output release-assets
          python scripts/packaging/sources.py release --sources release-assets --native release-assets --output release-assets --verify-only
          python scripts/packaging/checksums.py release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-assets/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  # Approval of the existing tag-only release environment authorizes publication.
  release-draft:
    name: approve, sign and publish
    timeout-minutes: 60
    if: needs.release-status.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v') && vars.JVID_RELEASE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: [source-check, release-status]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck immutable release before signing
        id: writable
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
          JVID_RELEASE_ENABLED: ${{ vars.JVID_RELEASE_ENABLED }}
        run: python scripts/release/publish.py preflight
      - uses: actions/download-artifact@v4
        if: steps.writable.outputs.publish == 'true'
        with:
          name: release-candidate
          path: release-assets
      - name: Verify generated source and native release contract
        if: steps.writable.outputs.publish == 'true'
        run: |
          python scripts/packaging/assert_assets.py release-assets
          python scripts/packaging/sources.py release --sources release-assets --native release-assets --output release-assets --verify-only
      - name: Sign final updater metadata
        if: steps.writable.outputs.publish == 'true'
        env:
          JVID_UPDATE_SIGNING_KEY: ${{ secrets.JVID_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$JVID_UPDATE_SIGNING_KEY" && test -n "$JVID_UPDATE_PUBLIC_KEY"
          cargo run --release --locked -p jvid-updater --bin jvid-update-metadata -- "${GITHUB_REF_NAME#v}" packaging/release-notes.md release-assets
          test -s release-assets/jvid-update.json
          test "$(wc -c < release-assets/jvid-update.json.sig)" -eq 64
      - name: Verify, upload draft assets and publish
        if: steps.writable.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.release }}
          JVID_RELEASE_ENABLED: ${{ vars.JVID_RELEASE_ENABLED }}
        run: |
          python scripts/packaging/checksums.py release-assets
          python scripts/release/publish.py publish
