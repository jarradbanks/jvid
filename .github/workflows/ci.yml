name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Private repo: macOS bills 10x and Windows 2x, so PRs run Linux only; main and manual runs get all three.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable + rustfmt + clippy; rustup installs it on first cargo call.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # FFmpeg dev libraries (docs/adr/0001-ffmpeg-binding.md). bindgen's libclang ships on all runners.
      # suite-ui GPU tests render on Mesa lavapipe; required on Linux so they can't pass by skipping.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libasound2-dev
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - if: runner.os == 'Windows'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: C:\ffmpeg
          key: ffmpeg-n8.1-win64-lgpl-shared
      - if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
          unzip -q ffmpeg.zip -d /c/ffmpeg-tmp
          mv /c/ffmpeg-tmp/ffmpeg-* /c/ffmpeg
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'FFMPEG_DIR=C:\ffmpeg' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          echo 'C:\ffmpeg\bin' >> "$GITHUB_PATH"
      # Test media corpus (scripts/gen-test-media), Linux only to save CI minutes.
      - if: runner.os == 'Linux'
        id: media-cache
        uses: actions/cache@v4
        with:
          path: test-media
          key: test-media-${{ hashFiles('scripts/gen-test-media') }}
      - if: runner.os == 'Linux' && steps.media-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          time bash scripts/gen-test-media
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          JVID_GPU_TESTS: ${{ runner.os == 'Linux' && 'required' || '' }}
          JVID_TEST_MEDIA_REQUIRED: ${{ runner.os == 'Linux' && '1' || '' }}
      # jvid-core stays free of UI, media and I/O stacks.
      - name: jvid-core boundary
        shell: bash
        run: |
          if cargo tree -p jvid-core -e normal,build --prefix none | grep -E '^(egui|eframe|epaint|winit|wgpu|ffmpeg[a-z_-]*|rfd|cpal|image|jvid-media|jvid-render|jvid-audio|suite-ui) '; then
            echo "::error::jvid-core depends on a UI/media/I/O crate"; exit 1
          fi

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
