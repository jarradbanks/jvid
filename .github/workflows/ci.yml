name: CI

on:
  pull_request:
  # Nightly and manual runs cover all three OSes; PRs and branch pushes run Linux.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
  # Verify combined develop integration before preparing a frozen release candidate.
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Per event, so an on-demand run never cancels the nightly.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables only: faster builds and links and a smaller cache, while backtraces keep file:line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/github-script@v8
        id: filter
        with:
          script: |
            // Keep translation-only PRs lightweight (#309), but always report CI required.
            if (context.eventName !== 'pull_request') {
              core.setOutput('rust', 'true');
              core.setOutput('i18n', 'false');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            // Renames must account for the old path too (for example, moving Rust into i18n).
            const paths = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
            const translation = /^(crates\/[^/]+\/i18n\/|docs\/i18n\/)/;
            // The API returns at most 3,000 files; run everything if the list may be incomplete.
            const all = files.length >= 3000 || paths.length === 0;
            core.setOutput('rust', all || paths.some(path => !translation.test(path)));
            core.setOutput('i18n', all || paths.some(path =>
              translation.test(path) ||
              /^crates\/suite-ui\/assets\/NotoSansCJK-/.test(path) ||
              [
                'scripts/i18n_check.py',
                'scripts/test_i18n_check.py',
                'crates/suite-ui/assets/subset-cjk.py',
                '.github/workflows/i18n.yml',
                '.github/workflows/ci.yml',
              ].includes(path)
            ));

  check:
    name: check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # PRs run Linux only; nightly and manual runs get all three.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins stable + rustfmt + clippy; rustup installs it on first cargo call.
      - run: rustup show
      # Only main saves: PR caches are never reused, and they evicted main's under the 10 GB limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # FFmpeg libraries and CLI: runtime fixtures need the executable even on media-cache hits.
      # See docs/adr/0001-ffmpeg-binding.md. bindgen's libclang ships on all runners.
      # suite-ui GPU tests render on Mesa lavapipe; required on Linux so they can't pass by skipping.
      # Arabic and CJK fonts for the text shaping tests, also required on Linux.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          # Hosted Ubuntu uses this mirror list; fail visibly if a new image changes that integration.
          cat /etc/apt/sources.list.d/ubuntu.sources
          cat /etc/apt/apt-mirrors.txt
          if [[ "$(grep '^URIs:' /etc/apt/sources.list.d/ubuntu.sources | sort -u)" != 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' ]]; then
            echo '::error::Unexpected Ubuntu APT sources; review the runner mirror configuration'
            exit 1
          fi
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'http://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends mesa-vulkan-drivers \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libasound2-dev \
            fonts-dejavu-core fonts-noto-cjk
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
      - if: runner.os == 'Windows'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: C:\ffmpeg
          key: ffmpeg-n8.1-win64-lgpl-shared
      - if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
          unzip -q ffmpeg.zip -d /c/ffmpeg-tmp
          mv /c/ffmpeg-tmp/ffmpeg-* /c/ffmpeg
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'FFMPEG_DIR=C:\ffmpeg' >> "$GITHUB_ENV"
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          echo 'C:\ffmpeg\bin' >> "$GITHUB_PATH"
      # Test media corpus (scripts/gen-test-media), Linux only to save CI minutes.
      - if: runner.os == 'Linux'
        id: media-cache
        uses: actions/cache@v4
        with:
          path: test-media
          key: test-media-${{ hashFiles('scripts/gen-test-media') }}
      - if: runner.os == 'Linux' && steps.media-cache.outputs.cache-hit != 'true'
        run: |
          time bash scripts/gen-test-media
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # macOS has no software adapter, so its GPU tests skip; Linux (lavapipe) and Windows (WARP) must run them.
      - if: runner.os == 'macOS'
        run: echo "::notice::GPU tests skip on macOS (no software adapter on hosted runners)"
      # Every crate's failures, not just the first failing crate's.
      - run: cargo test --workspace --no-fail-fast
        env:
          JVID_GPU_TESTS: ${{ runner.os != 'macOS' && 'required' || '' }}
          JVID_TEST_MEDIA_REQUIRED: ${{ runner.os == 'Linux' && '1' || '' }}
          # Ubuntu's and Homebrew's FFmpeg have libx265; the Windows LGPL build doesn't.
          JVID_X265_TESTS: ${{ runner.os != 'Windows' && 'required' || '' }}
      # Snapshot diffs differ per driver, so keep them to see what failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: crates/*/tests/snapshots/*.png
          if-no-files-found: ignore
      # Playback throughput (#32) only means anything optimised. Its release build costs PRs 2-5 minutes, so it runs on main only (Linux).
      - if: runner.os == 'Linux' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash # pipefail, so the tee doesn't hide a failure
        # The grep fails the gate if the test didn't run (the tests are in the lib, not the bin).
        run: |
          cargo test --release -p jvid-app --lib -- playback::tests::two_layer --nocapture | tee perf.log
          grep -q 'PERF playback two-layer' perf.log
        env:
          JVID_GPU_TESTS: required
          JVID_TEST_MEDIA_REQUIRED: '1'
      # Perf numbers against docs/perf.md, reported to the job summary; non-blocking (noisy runners, lavapipe).
      - if: runner.os == 'Linux' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: perf report
        continue-on-error: true
        shell: bash
        run: |
          status=0
          {
            cargo test --release -p jvid-app --lib -- perf_cold_start --nocapture
            cargo test --release -p jvid-app --lib -- seek_latency scrub_1080p30 long_recording five_hundred_clips --nocapture
            cargo test --release -p jvid-media -p jvid-audio -- one_hour_query sixteen_tracks lossless_minute --nocapture
            cargo bench -p jvid-core --bench core -- --quick
          } 2>&1 | tee -a perf.log || status=1
          { echo '### Perf (budgets: docs/perf.md)'; echo '```'
            grep -E 'PERF |timeline layout|tracks:|per 2000 px|time:|^(video_at|keyframe)' perf.log | sed 's/.*PERF /PERF /'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
        env:
          JVID_GPU_TESTS: required
          JVID_TEST_MEDIA_REQUIRED: '1'
      # jvid-core stays free of UI, media and I/O stacks.
      - name: jvid-core boundary
        shell: bash
        run: |
          if cargo tree -p jvid-core -e normal,build --prefix none | grep -E '^(egui|eframe|epaint|winit|wgpu|ffmpeg[a-z_-]*|rfd|cpal|image|jvid-media|jvid-render|jvid-audio|jvid-transcribe|whisper-rs[a-z-]*|ureq|suite-ui) '; then
            echo "::error::jvid-core depends on a UI/media/I/O crate"; exit 1
          fi

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  i18n:
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    uses: ./.github/workflows/i18n.yml

  release-automation:
    name: release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/release -p 'test_*.py'

  # Require this one check in branch protection; the individual jobs may legitimately skip.
  required:
    name: CI required
    needs: [changes, check, deny, i18n, release-automation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            if (needs['release-automation'].result !== 'success') {
              core.setFailed(`Release automation ${needs['release-automation'].result}`);
            }
            if (needs.changes.result !== 'success') {
              core.setFailed(`Change detection ${needs.changes.result}`);
              return;
            }
            for (const [output, jobs] of Object.entries({rust: ['check', 'deny'], i18n: ['i18n']})) {
              const enabled = needs.changes.outputs[output];
              if (!['true', 'false'].includes(enabled)) {
                core.setFailed(`Missing or invalid ${output} change detection output`);
                continue;
              }
              const expected = enabled === 'true' ? 'success' : 'skipped';
              for (const job of jobs) {
                if (needs[job].result !== expected) {
                  core.setFailed(`${job}: expected ${expected}, got ${needs[job].result}`);
                }
              }
            }
