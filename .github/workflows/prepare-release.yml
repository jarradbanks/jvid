name: Prepare release
run-name: Prepare ${{ inputs.bump }} release from develop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increase for this release
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure candidate commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main develop
      - name: Prepare version, locked packages, notes and release PR
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python scripts/release/automation.py prepare --bump "$RELEASE_BUMP"
      - name: Release candidate
        env:
          PR_URL: ${{ steps.prepare.outputs.pr_url }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          {
            echo "Release candidate: $RELEASE_VERSION"
            echo "$PR_URL"
            echo 'Review the notes and candidate packages, then merge the release PR into main.'
          } >> "$GITHUB_STEP_SUMMARY"
