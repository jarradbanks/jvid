name: Updater

on:
  pull_request:
    paths:
      - '.github/workflows/updater.yml'
      - 'crates/jvid-update-config/**'
      - 'packaging/windows.iss'
      - 'packaging/whisper-models.iss'
      - 'scripts/packaging/installer_models.py'
      - 'scripts/packaging/test_installer_*.py'
      - 'assets/jvid.ico'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-inno:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: updater-native-inno
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Ensure Inno compiler
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Model downloads and preservation in isolated installers
        run: python -m unittest discover -s scripts/packaging -p 'test_installer_*.py'
        env:
          JVID_TEST_ISCC: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - run: cargo test --locked -p jvid-update-config
      - name: Real Inno upgrade in an isolated temporary tree
        run: cargo test --locked -p jvid-update-config --test inno native_inno_upgrade -- --ignored --nocapture
        env:
          JVID_INNO_ISCC: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
