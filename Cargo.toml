[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarradbanks/jvid"
publish = false

[workspace.dependencies]
jvid-audio = { path = "crates/jvid-audio" }
jvid-core = { path = "crates/jvid-core" }
jvid-media = { path = "crates/jvid-media" }
jvid-render = { path = "crates/jvid-render" }
suite-ui = { path = "crates/suite-ui" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
