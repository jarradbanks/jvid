[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarradbanks/jvid"
publish = false

[workspace.dependencies]
jvid-audio = { path = "crates/jvid-audio" }
jvid-core = { path = "crates/jvid-core" }
jvid-media = { path = "crates/jvid-media" }
jvid-log = { path = "crates/jvid-log" }
jvid-jobs = { path = "crates/jvid-jobs" }
jvid-render = { path = "crates/jvid-render" }
suite-ui = { path = "crates/suite-ui" }
proptest = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
directories = "6"
tracing = "0.1"
wgpu = "30"
cosmic-text = "0.15"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }

egui = "0.36.2"
eframe = { version = "0.36.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_kittest = { version = "0.36.0", features = ["wgpu", "snapshot"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

# Debug FFmpeg decode and plane copies are too slow for the corpus tests at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
